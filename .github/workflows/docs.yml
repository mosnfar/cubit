name: Deploy documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: read

# The site is published from the team repo, which has Pages enabled. Copies of the
# repo (such as a personal mirror) still build and type-check the docs, but skip
# publishing, which would fail without Pages.
env:
  PUBLISH: ${{ github.event_name != 'pull_request' && github.repository == 'mosnfar/quell' }}

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install documentation dependencies
        run: pnpm install --filter @quell/docs... --frozen-lockfile
      - name: Configure Pages
        id: pages
        if: env.PUBLISH == 'true'
        uses: actions/configure-pages@v5
      - name: Check types
        run: pnpm --filter @quell/docs typecheck
      - name: Export documentation
        run: pnpm build:docs
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ env.PUBLISH == 'true' && steps.pages.outputs.base_path || format('/{0}', github.event.repository.name) }}
      - name: Upload Pages artifact
        if: env.PUBLISH == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/out

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'mosnfar/quell'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
